name: Windows 10 and 11 lifecycle

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      run_id:
        required: true
        type: string
      screenshot_certificate:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  client:
    name: ${{ matrix.os }} x64 VM
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        os: [windows-10, windows-11]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: .build/dist
      - name: Чистая Windows, установка, удаление и проверка после перезагрузки
        shell: bash
        env:
          CLIENT_OS: ${{ matrix.os }}
        run: bash automation/client/Run.sh
      - name: Зашифровать снимки клиентской Windows
        if: always() && inputs.screenshot_certificate != ''
        shell: pwsh
        env:
          SCREENSHOT_CERTIFICATE: ${{ inputs.screenshot_certificate }}
        run: ./automation/Export-Screenshots.ps1 -Directory "$env:RUNNER_TEMP/client-windows/shared/screenshots" -Output "$env:RUNNER_TEMP/client-screenshots.p7m"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: always() && inputs.screenshot_certificate != ''
        with:
          name: encrypted-ui-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/client-screenshots.p7m
          if-no-files-found: error
          retention-days: 1
