name: Microsoft Runtimes AIO

on:
  schedule:
    - cron: '23 6 1,16 * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Собрать заново, даже если такой набор уже есть'
        type: boolean
        default: false
      screenshot_certificate:
        description: 'Публичный PEM-сертификат для зашифрованной передачи снимков на локальную проверку'
        type: string
        default: ''
      interface_only:
        description: 'Проверить только логику и окна, без сборки установочного пакета'
        type: boolean
        default: false
  push:
    branches: [master, 'automation/**']
    paths: ['automation/**', 'installer/**', 'build_tools/**', '.github/workflows/**']

permissions:
  contents: read
  actions: read

concurrency:
  group: runtimes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  keep-schedule:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Сохранить ежемесячное расписание активным
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable update.yml

  build:
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      artifact: ${{ steps.build.outputs.artifact }}
      candidate_id: ${{ steps.candidate.outputs.artifact-id }}
      verified_run_id: ${{ steps.build.outputs.verified_run_id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Проверка логики обновления и установщика
        run: |
          ./automation/Test.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./automation/Test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 tests failed.' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./automation/Test-SelectionUi.ps1 -PayloadRoot ./installer
          if ($LASTEXITCODE -ne 0) { throw 'Package selection dialog tests failed.' }
      - name: Размещение текста и окна при разных размерах шрифта
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./automation/Test-WindowProbe.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native font measurement tests failed.' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./automation/Test-Interface.ps1 -PayloadRoot ./installer -ScreenshotDirectory "$env:RUNNER_TEMP/interface-screenshots"
          if ($LASTEXITCODE -ne 0) { throw 'Interface layout tests failed.' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./automation/Test-Launcher.ps1 -ScreenshotDirectory "$env:RUNNER_TEMP/interface-screenshots/launcher"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher failure reporting tests failed.' }
      - name: Проверка Microsoft и сборка полного набора
        if: ${{ !inputs.interface_only }}
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: ./automation/Build.ps1 -Force:($env:FORCE_BUILD -eq 'true')
      - name: Окна справки, распаковки и отмены готового EXE
        if: steps.build.outputs.changed == 'true'
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./automation/Test-InteractiveInstall.ps1 -Installer ./.build/dist/Runtimes_AIO_x86_x64.exe -ScreenshotDirectory "$env:RUNNER_TEMP/interface-screenshots/sfx" -DialogsOnly
          if ($LASTEXITCODE -ne 0) { throw 'SFX dialog tests failed.' }
      - name: Обновление VC2010 с зарегистрированным старым патчем
        if: steps.build.outputs.changed == 'true'
        run: ./automation/Test-Vc2010Upgrade.ps1
      - name: Диагностика ранней проверки установки
        if: failure() && steps.build.outputs.changed == 'true'
        run: ./automation/Diagnostics.ps1
      - name: Зашифровать снимки для локальной проверки
        if: always() && inputs.screenshot_certificate != ''
        env:
          SCREENSHOT_CERTIFICATE: ${{ inputs.screenshot_certificate }}
        run: ./automation/Export-Screenshots.ps1 -Directory "$env:RUNNER_TEMP/interface-screenshots" -Output "$env:RUNNER_TEMP/interface-screenshots.p7m"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        if: always() && inputs.screenshot_certificate != ''
        with:
          name: encrypted-ui-build-${{ github.run_id }}
          path: ${{ runner.temp }}/interface-screenshots.p7m
          if-no-files-found: error
          retention-days: 1
      - name: Временный пакет для тестовых машин
        if: steps.build.outputs.changed == 'true'
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  lifecycle:
    needs: build
    if: needs.build.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/dist
      - name: Установка, восстановление, удаление и запуск приложений x86/x64
        run: ./automation/Smoke.ps1
      - name: Диагностика ошибки установки
        if: failure()
        run: ./automation/Diagnostics.ps1

  client:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/client-windows.yml
    with:
      artifact: unverified-${{ github.run_id }}-${{ github.run_attempt }}
      run_id: ${{ github.run_id }}
      screenshot_certificate: ${{ inputs.screenshot_certificate || '' }}

  verified:
    needs: [build, lifecycle, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: unverified-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Готовый установщик после прохождения всех стендов
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [build, verified]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/master' &&
      needs.build.result == 'success' &&
      (needs.verified.result == 'success' || needs.build.outputs.changed == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: ${{ needs.build.outputs.artifact }}
          run-id: ${{ needs.build.outputs.verified_run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: GitHub Release с кратким описанием и установщиком
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_RUN_ID: ${{ needs.build.outputs.verified_run_id }}
        run: ./automation/Release.ps1

  cleanup:
    needs: [build, lifecycle, client, verified, release]
    if: always() && needs.build.outputs.candidate_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Удалить временный непроверенный пакет
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.candidate_id }}
        run: gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID"
